name: Update reports for all candidates
run-name: >-
  Update reports for all candidates (${{ github.event_name == 'push' && 'after a push, committing' ||
  inputs.commit && 'by hand, committing' || 'by hand, not committing' }})

# Start on a push to any branch, or by hand, optionally committing the reports.
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      commit:
        description: Commit the reports to this branch
        default: true
        type: boolean

# Let the workflow commit the reports.
permissions:
  contents: write

# Cancel any unfinished run from an earlier push when a new push is made to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:

  # After a push, determine whether the candidates have changed since the reports were last made.
  detect-candidate-changes:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Compare the candidates with those last reported on
        id: compare
        run: |
          # Must hash as record-last-check does.
          hash=$(LC_ALL=C sha256sum candidates/* | sha256sum | cut -d' ' -f1)
          if [ -f reports/last-check.json ] && [ "$(jq -r .hash reports/last-check.json)" = "$hash" ]; then
            echo "The candidates haven't changed since the reports were last made." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Make the reports, committing any that changed after a push or when Commit is ticked.
  update-reports:
    needs: detect-candidate-changes
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.detect-candidate-changes.outputs.changed == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Temporary, until repros gives the container the host user's ID.
      - name: Create the log directories and make the whole repository writable
        run: |
          mkdir -p .repro-logs .repro-sessions/active
          chmod -R a+rwX .

      - name: Build the image
        run: make build-image

      - name: Make the reports
        run: |
          # The options are temporary, until repros gives the container the host user's ID and detects
          # that there is no terminal.
          make build-reports REPRO_INTERACTIVE_SESSION=false \
              REPRO_DOCKER_OPTIONS="--env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env 'GIT_CONFIG_VALUE_0=*'"

      - name: Commit the reports
        if: github.event_name == 'push' || inputs.commit
        run: |
          if [ -n "$(git status --porcelain -- reports)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- reports
            git commit -m "Update reports for all candidates"
            git push
            echo "Committed the new reports to ${{ github.ref_name }}." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show the reports
        if: ${{ !cancelled() }}
        run: cat reports/integrated-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: reports/
