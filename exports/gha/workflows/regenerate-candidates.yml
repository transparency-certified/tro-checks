name: Regenerate candidates
run-name: >-
  Regenerate candidates (${{ inputs.commit && 'by hand, commit requested' || 'by hand, no commit requested' }})

# Start by hand, optionally committing the candidates and reports.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit the candidates and reports to this branch
        default: false
        type: boolean

# Let the workflow commit the candidates and reports.
permissions:
  contents: write

jobs:

  # Make the candidates and reports, committing any that changed when Commit is ticked.
  make-candidates-and-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Find the tro-checks commit the image will be built with
        id: find-tro-checks
        run: echo "tro-checks=$(bash .github/scripts/describe-tro-checks)" >> "$GITHUB_OUTPUT"
#       outputs:
#         tro-checks

      - name: Show the run's record
        uses: ./.github/actions/show-run-record
        with:
          rows: |
            Triggered by: manual run by ${{ github.actor }}
            Candidates' sources version: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) on ${{ github.ref_name }}
            Commit candidates and reports: ${{ inputs.commit && 'yes' || 'no' }}
            tro-checks version: ${{ steps.find-tro-checks.outputs.tro-checks }}

      # Temporary, until repros gives the container the host user's ID.
      - name: Create the log directories and make the whole repository writable
        run: |
          mkdir -p .repro-logs .repro-sessions/active
          chmod -R a+rwX .

      - name: Build the image
        run: make build-image

      - name: Make the candidates
        run: |
          # The options are temporary, until repros gives the container the host user's ID and detects
          # that there is no terminal.
          make build-candidates REPRO_INTERACTIVE_SESSION=false \
              REPRO_DOCKER_OPTIONS="--env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env 'GIT_CONFIG_VALUE_0=*'"

      - name: Make the reports
        run: |
          # The options are temporary, until repros gives the container the host user's ID and detects
          # that there is no terminal.
          make build-reports REPRO_INTERACTIVE_SESSION=false \
              REPRO_DOCKER_OPTIONS="--env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env 'GIT_CONFIG_VALUE_0=*'"

      - name: Commit the candidates and reports
        if: inputs.commit
        run: |
          if [ -n "$(git status --porcelain -- candidates reports)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- candidates reports
            git commit -m "Regenerate candidates"
            git push
            echo "Committed the new candidates and reports to ${{ github.ref_name }}." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show the reports
        run: cat reports/integrated-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the candidates and reports
        uses: actions/upload-artifact@v7
        with:
          name: candidates-and-reports
          path: |
            candidates/
            reports/
