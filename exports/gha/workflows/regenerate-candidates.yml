name: Regenerate candidates
run-name: >-
  Regenerate candidates (${{ github.event_name == 'push' && 'after a push' ||
  inputs.commit && 'by hand, commit requested' || 'by hand, no commit requested' }})

# Start on a push to any branch, or by hand, optionally committing the candidates and reports.
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      commit:
        description: Commit the candidates and reports to this branch
        default: false
        type: boolean

# Let the workflow commit the candidates and reports.
permissions:
  contents: write

# Cancel any unfinished run from an earlier push when a new push is made to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:

  # Record the run, and check the precondition for generating the candidates: that the run was started
  # by hand or the candidates' dependencies have changed since they were last generated.
  check-preconditions:
    runs-on: ubuntu-latest
    outputs:
      preconditions-met: ${{ steps.check.outputs.preconditions-met }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Find the tro-checks commit the image will be built with
        id: find-tro-checks
        run: echo "tro-checks=$(bash .github/scripts/describe-tro-checks)" >> "$GITHUB_OUTPUT"
#       outputs:
#         tro-checks

      - name: Show the run's record
        uses: ./.github/actions/show-run-record
        with:
          rows: |
            Candidates' dependencies version: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}) on ${{ github.ref_name }}
            Commit candidates and reports: ${{ github.event_name != 'push' && (inputs.commit && 'yes' || 'no') || '' }}
            tro-checks version: ${{ steps.find-tro-checks.outputs.tro-checks }}

      - name: Check the precondition
        id: check
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$(bash .github/scripts/candidate-dependencies-changed)" != true ]; then
            echo "Stopped after $GITHUB_JOB: the candidates are up to date." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "preconditions-met=true" >> "$GITHUB_OUTPUT"
          fi
#       outputs:
#         preconditions-met

  # Generate the candidates and reports, committing any that changed after a push or when Commit is ticked.
  generate-candidates-and-reports:
    needs: check-preconditions
    if: needs.check-preconditions.outputs.preconditions-met == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Temporary, until repros gives the container the host user's ID.
      - name: Create the log directories and make the whole repository writable
        run: |
          mkdir -p .repro-logs .repro-sessions/active
          chmod -R a+rwX .

      - name: Build the image
        run: make build-image

      - name: Generate the candidates
        run: |
          make init-repro REPRO_INTERACTIVE_SESSION=false
          # The options are temporary, until repros gives the container the host user's ID and detects
          # that there is no terminal.
          make generate-candidates REPRO_INTERACTIVE_SESSION=false \
              REPRO_DOCKER_OPTIONS="--env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env 'GIT_CONFIG_VALUE_0=*'"

      - name: Generate the reports
        run: |
          # The options are temporary, until repros gives the container the host user's ID and detects
          # that there is no terminal.
          make generate-tro-reports REPRO_INTERACTIVE_SESSION=false \
              REPRO_DOCKER_OPTIONS="--env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env 'GIT_CONFIG_VALUE_0=*'"

      - name: Commit the candidates and reports
        if: github.event_name == 'push' || inputs.commit
        run: |
          if [ -n "$(git status --porcelain -- candidates reports)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- candidates reports
            git commit -m "Regenerate candidates"
            git push
            echo "Committed the new candidates and reports to ${{ github.ref_name }}." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show the reports
        run: cat reports/integrated-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the candidates and reports
        uses: actions/upload-artifact@v7
        with:
          name: candidates-and-reports
          path: |
            candidates/
            reports/
