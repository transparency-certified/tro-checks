name: Preview report for one candidate
run-name: >-
  Preview report for ${{ inputs.candidate }} (${{ inputs.version }}, ${{ inputs.tier }},
  ${{ inputs.repository-image && 'this repository''s image' || format('tro-checks {0}', inputs.tro-checks) }})

# Start by hand, naming the candidate, the target, and the image to check it with.
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: The candidate's name, as in the manifest
        required: true
        type: string
      version:
        description: The TRACE version to check it against
        default: trace-main
        type: string
      tier:
        description: The tier to check it for
        default: STANDALONE-TRO
        type: string
      tro-checks:
        description: The version of tro-checks' published image, main or a release tag
        default: main
        type: string
      repository-image:
        description: Use this repository's image instead
        default: false
        type: boolean

# Let the workflow read the repository, and nothing more.
permissions:
  contents: read

jobs:

  # Check the candidate and show its report, committing nothing.
  preview-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Stop if no candidate has that name
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          if ! jq -e --arg name "$CANDIDATE" 'has($name)' candidates/manifest.json > /dev/null || \
             [ ! -f "candidates/$CANDIDATE.jsonld" ]; then
            echo "No candidate named $CANDIDATE: the names are $(jq -r 'keys | join(", ")' candidates/manifest.json)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Check the candidate
        uses: ./.github/actions/check-declaration
        with:
          declaration: candidates/${{ inputs.candidate }}.jsonld
          report: preview/report.md
          version: ${{ inputs.version }}
          tier: ${{ inputs.tier }}
          repository-image: ${{ inputs.repository-image }}
          tro-checks: ${{ inputs.tro-checks }}

      - name: Show the report
        run: cat preview/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the report
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: preview/report.md
