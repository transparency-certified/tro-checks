name: Preview one candidate
run-name: >-
  Preview one candidate (${{ inputs.candidate }}, ${{ inputs.version }}, ${{ inputs.tier }},
  ${{ inputs.repository-image && 'this repository''s image' || format('tro-checks {0}', inputs.tro-checks) }})

# Start by hand, naming the candidate, the target, and the image to check it with.
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: The candidate file
        required: true
        type: string
      version:
        description: The TRACE version to check it against
        default: trace-main
        type: choice
        options:
          - trace-main
          - trace-2026-04-19
      tier:
        description: The tier to check it for
        default: STANDALONE-TRO
        type: choice
        options:
          - SAFE-JSON
          - SAFE-JSON-LD
          - TRACE-PERMISSIBLE-JSON-LD
          - USES-TROV-CORRECTLY
          - DEFINES-TRS
          - STANDALONE-TRO
          - LINKABLE-TRO
      tro-checks:
        description: The version of tro-checks' published image, main or a release tag
        default: main
        type: string
      repository-image:
        description: Use this repository's image instead
        default: false
        type: boolean

# Let the workflow read the repository, and nothing more.
permissions:
  contents: read

jobs:

  # Check the candidate and show its report, committing nothing.
  check-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Find the candidate's declaration
        id: find-declaration
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          declaration=$CANDIDATE
          if [[ $declaration != */* ]]; then
            declaration=candidates/${declaration%.jsonld}.jsonld
          fi
          if [ ! -f "$declaration" ]; then
            echo "No file $declaration: the candidates are $(jq -r 'keys | map(. + ".jsonld") | join(", ")' candidates/manifest.json)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "declaration=$declaration" >> "$GITHUB_OUTPUT"

      - name: Check the candidate
        uses: ./.github/actions/check-tro-declaration
        with:
          declaration: ${{ steps.find-declaration.outputs.declaration }}
          report: preview/report.md
          version: ${{ inputs.version }}
          tier: ${{ inputs.tier }}
          repository-image: ${{ inputs.repository-image }}
          tro-checks: ${{ inputs.tro-checks }}

      - name: Show the report
        run: cat preview/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the report
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: preview/report.md
