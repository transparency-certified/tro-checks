name: Preview one candidate
run-name: >-
  Preview one candidate (${{ inputs.candidate }}, ${{ inputs.target-version }}, ${{ inputs.target-tier }})

# Start by hand, naming the candidate and the target to check it against.
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: The candidate file
        required: true
        type: string
      target-version:
        description: The TRACE version to check it against
        default: trace-main
        type: choice
        options:
          - trace-main
          - trace-2026-04-19
      target-tier:
        description: The tier to check it for
        default: STANDALONE-TRO
        type: choice
        options:
          - SAFE-JSON
          - SAFE-JSON-LD
          - TRACE-PERMISSIBLE-JSON-LD
          - USES-TROV-CORRECTLY
          - DEFINES-TRS
          - STANDALONE-TRO
          - LINKABLE-TRO

# Let the workflow read the repository, and nothing more.
permissions:
  contents: read

jobs:

  # Check the candidate and show its report, committing nothing.
  check-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Find the candidate's declaration
        id: find-declaration
        env:
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          declaration_file=$CANDIDATE
          if [[ $declaration_file != */* ]]; then
            declaration_file=candidates/${declaration_file%.jsonld}.jsonld
          fi
          if [ ! -f "$declaration_file" ]; then
            echo "No file $declaration_file: the candidates are $(jq -r 'keys | map(. + ".jsonld") | join(", ")' candidates/manifest.json)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "declaration-file=$declaration_file" >> "$GITHUB_OUTPUT"

      - name: Check the candidate
        uses: ./.github/actions/check-tro-declaration
        with:
          declaration-file: ${{ steps.find-declaration.outputs.declaration-file }}
          report-file: preview/report.md
          target-version: ${{ inputs.target-version }}
          target-tier: ${{ inputs.target-tier }}

      - name: Show the report
        run: cat preview/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the report
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: preview/report.md
