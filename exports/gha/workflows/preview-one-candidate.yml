name: Preview one candidate
run-name: >-
  Preview one candidate (${{ inputs.candidate }}, ${{ inputs.target-version }}, ${{ inputs.target-tier }})

# Start by hand, naming the candidate and the target to check it against.
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: The candidate file
        required: true
        type: string
      target-version:
        description: The TRACE version to check it against
        default: trace-main
        type: choice
        options:
          - trace-main
          - trace-2026-04-19
      target-tier:
        description: The tier to check it for
        default: STANDALONE-TRO
        type: choice
        options:
          - SAFE-JSON
          - SAFE-JSON-LD
          - TRACE-PERMISSIBLE-JSON-LD
          - USES-TROV-CORRECTLY
          - DEFINES-TRS
          - STANDALONE-TRO
          - LINKABLE-TRO

# Let the workflow read the repository, and nothing more.
permissions:
  contents: read

jobs:

  # Record the run, and check the preconditions for checking the candidate: that the candidate file
  # exists, and that the TRACE version has the tier.
  check-preconditions:
    runs-on: ubuntu-latest
    outputs:
      declaration-file: ${{ steps.find-declaration.outputs.declaration-file }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Find the tro-checks commit the image will be built with
        id: find-tro-checks
        run: echo "tro-checks=$(bash .github/scripts/describe-tro-checks)" >> "$GITHUB_OUTPUT"
#       outputs:
#         tro-checks

      - name: Look up the tier's title
        id: look-up-tier
        env:
          TARGET_VERSION: ${{ inputs.target-version }}
          TARGET_TIER: ${{ inputs.target-tier }}
        run: echo "tier-title=$(bash .github/scripts/tier-title "$TARGET_VERSION" "$TARGET_TIER")" >> "$GITHUB_OUTPUT"
#       outputs:
#         tier-title

      - name: Show the run's record
        uses: ./.github/actions/show-run-record
        with:
          rows: |
            Triggered by: manual run by ${{ github.actor }}
            Candidate: ${{ inputs.candidate }}
            Candidate version: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) on ${{ github.ref_name }}
            Targeted TRACE tier and version: `${{ steps.look-up-tier.outputs.tier-title }}` of `${{ inputs.target-version }}`
            tro-checks version: ${{ steps.find-tro-checks.outputs.tro-checks }}

      - name: Find the candidate's declaration
        id: find-declaration
        uses: ./.github/actions/find-candidate-declaration
        with:
          candidate: ${{ inputs.candidate }}
#       outputs:
#         declaration-file

      - name: Check that the TRACE version has the tier
        env:
          TARGET_VERSION: ${{ inputs.target-version }}
          TARGET_TIER: ${{ inputs.target-tier }}
        run: |
          tiers=$(bash .github/scripts/version-tiers "$TARGET_VERSION")
          if [ -z "$tiers" ]; then
            echo "This repository's tro-checks has no TRACE version $TARGET_VERSION." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ ", $tiers, " != *", $TARGET_TIER, "* ]]; then
            echo "$TARGET_VERSION has no tier $TARGET_TIER: its tiers are $tiers." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  # Check the candidate and show its report, committing nothing.
  check-candidate:
    needs: check-preconditions
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Check the candidate
        uses: ./.github/actions/check-tro-declaration
        with:
          declaration-file: ${{ needs.check-preconditions.outputs.declaration-file }}
          report-file: preview/report.md
          target-version: ${{ inputs.target-version }}
          target-tier: ${{ inputs.target-tier }}

      - name: Show the report
        run: cat preview/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the report
        uses: actions/upload-artifact@v7
        with:
          name: report
          path: preview/report.md
