name: Regenerate reports
run-name: >-
  Regenerate reports (${{ github.event_name == 'push' && 'after a push' ||
  inputs.commit && 'by hand, commit requested' || 'by hand, no commit requested' }})

# Start on a push to any branch, or by hand, optionally committing the reports.
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      commit:
        description: Commit the reports to this branch
        default: true
        type: boolean

# Let the workflow commit the reports.
permissions:
  contents: write

# Cancel any unfinished run from an earlier push when a new push is made to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:

  # Record the run, and check the preconditions for making the reports: that there are candidates, and
  # that the run was started by hand or the candidates have changed since the reports were last generated
  # and won't be regenerated by Regenerate candidates.
  check-preconditions:
    runs-on: ubuntu-latest
    outputs:
      preconditions-met: ${{ steps.check.outputs.preconditions-met }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Find the tro-checks commit the image will be built with
        id: find-tro-checks
        run: echo "tro-checks=$(bash .github/scripts/describe-tro-checks)" >> "$GITHUB_OUTPUT"
#       outputs:
#         tro-checks

      - name: Show the run's record
        uses: ./.github/actions/show-run-record
        with:
          rows: |
            Candidates version: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}) on ${{ github.ref_name }}
            Commit reports: ${{ github.event_name != 'push' && (inputs.commit && 'yes' || 'no') || '' }}
            tro-checks version: ${{ steps.find-tro-checks.outputs.tro-checks }}

      - name: Check the preconditions
        id: check
        run: |
          if [ "$(jq length candidates/manifest.json 2> /dev/null || echo 0)" = 0 ]; then
            if [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "Stopped after $GITHUB_JOB: there are no candidates yet." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "Failed in $GITHUB_JOB: there are no candidates yet." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ -f .github/workflows/regenerate-candidates.yml ] &&
              [ "$(bash .github/scripts/candidate-dependencies-changed)" = true ]; then
            echo "Stopped after $GITHUB_JOB: the *Regenerate candidates* workflow will regenerate the reports." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$(bash .github/scripts/candidates-changed)" != true ]; then
            echo "Stopped after $GITHUB_JOB: the reports are up to date." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "preconditions-met=true" >> "$GITHUB_OUTPUT"
          fi
#       outputs:
#         preconditions-met

  # Generate the reports, committing any that changed after a push or when Commit is ticked.
  generate-reports:
    needs: check-preconditions
    if: needs.check-preconditions.outputs.preconditions-met == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # Temporary, until repros gives the container the host user's ID.
      - name: Create the log directories and make the whole repository writable
        run: |
          mkdir -p .repro-logs .repro-sessions/active
          chmod -R a+rwX .

      - name: Build the image
        run: make build-image

      - name: Generate the reports
        run: |
          make init-repro REPRO_INTERACTIVE_SESSION=false
          # The options are temporary, until repros gives the container the host user's ID and detects
          # that there is no terminal.
          make generate-tro-reports REPRO_INTERACTIVE_SESSION=false \
              REPRO_DOCKER_OPTIONS="--env GIT_CONFIG_COUNT=1 --env GIT_CONFIG_KEY_0=safe.directory --env 'GIT_CONFIG_VALUE_0=*'"

      - name: Commit the reports
        if: github.event_name == 'push' || inputs.commit
        run: |
          if [ -n "$(git status --porcelain -- reports)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- reports
            git commit -m "Regenerate reports"
            git push
            changes="${{ github.server_url }}/${{ github.repository }}/commit/$(git rev-parse HEAD)"
            echo "Committed the new reports to ${{ github.ref_name }} ([changes](${changes}))." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Show the reports
        run: cat reports/integrated-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the reports
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: reports/
