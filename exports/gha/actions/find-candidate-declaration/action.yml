name: Find candidate declaration
description: Find a candidate's declaration file, given its path or its file name in candidates/

inputs:
  candidate:
    description: A path in the repository, or a file name in candidates/ with or without .jsonld
    required: true

outputs:
  declaration-file:
    description: The declaration file's path in the repository
    value: ${{ steps.find.outputs.declaration-file }}

runs:
  using: composite
  steps:

    - name: Find the declaration file, or stop
      id: find
      shell: bash
      env:
        CANDIDATE: ${{ inputs.candidate }}
      run: |
        declaration_file=$CANDIDATE
        if [[ $declaration_file != */* ]]; then
          declaration_file=candidates/${declaration_file%.jsonld}.jsonld
        fi
        if [ ! -f "$declaration_file" ]; then
          echo "No file $declaration_file: the candidates are $(jq -r 'keys | map(. + ".jsonld") | join(", ")' candidates/manifest.json)." | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
        echo "declaration-file=$declaration_file" >> "$GITHUB_OUTPUT"
